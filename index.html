<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Page Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background: #24292e;
            color: #fff;
            padding: 2rem text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #fff;
            padding: 1.5rem;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

    <header>
        <h1>Welcome to My Static Page</h1>
        <p>Hosted entirely for free via GitHub Pages</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>About Me</h2>
            <p>Hello World! This is a clean layout hosted directly out of a GitHub repository.</p>
        </div>
    </div>

</body>
</html>
